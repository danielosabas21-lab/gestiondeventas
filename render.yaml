services:
  - type: web
    name: ema-mayoreo-web
    runtime: python
    plan: starter
    buildCommand: python prepare_app.py && pip install -r .deploy_src/requirements.txt
    startCommand: python .deploy_src/web_server.py
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    disk:
      name: ema-mayoreo-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: EMA_DATA_DIR
        value: /var/data
      - key: EMA_ACCESS_USER
        value: ema-admin
      - key: EMA_ACCESS_PASSWORD
        generateValue: true
